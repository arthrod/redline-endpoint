apiVersion: apps/v1
kind: Deployment
metadata:
  name: redline-api
  namespace: redline-api
  labels:
    app: redline-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redline-api
  template:
    metadata:
      labels:
        app: redline-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: redline-api
          image: ghcr.io/arthrod/redline-endpoint:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: RAPIDAPI_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: rapidapi-secrets
                  key: proxy-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      restartPolicy: Always
